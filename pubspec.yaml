name: clinical_ai_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons:
  google_fonts:
  lucide_icons_flutter:
  http:
  flutter_secure_storage:
  intl:
  provider:
  flutter_riverpod: ^2.6.1
  record:
  path_provider:
  permission_handler:
  web_socket:
  web_socket_channel:
  audioplayers:
  flutter_launcher_icons: ^0.14.4
  # PDF generation and file handling
  pdf: ^3.11.1
  printing: ^5.13.4
  open_file: ^4.0.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  shared_preferences: ^2.5.5
  device_preview: ^1.3.1
  custom_refresh_indicator: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/kuvaka_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:

  uses-material-design: true
  assets:
    - 'assets/'
